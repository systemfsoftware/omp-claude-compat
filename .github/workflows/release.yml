# Thin caller of the shared release toolchain
# (systemfsoftware/pnpm-release-management). The reusable workflow is the single
# definition of the release flow; this caller only supplies the trigger and the
# permissions. The toolchain reads this repo's release.jsonc and derives the
# phase (version / release / none) from repository state.
#
# tools-ref pins the toolchain revision the release runs from.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@prm/toolchain
    with:
      tools-ref: prm/toolchain
