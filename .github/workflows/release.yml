name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: plan · derive phase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preflight intent consumption
        run: pnpm version -r --dry-run
      - id: plan
        name: Decide release phase from repository state
        run: node scripts/plan-release.mjs --output "$GITHUB_OUTPUT"

  version:
    if: needs.plan.outputs.phase == 'version'
    needs: [plan]
    name: version · open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Consume pending change intents
        run: pnpm version -r
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
          BASE: ${{ github.event.repository.default_branch }}
        run: ./scripts/open-release-pr.sh

  publish:
    if: needs.plan.outputs.phase == 'publish'
    permissions:
      contents: write
      id-token: write
    name: publish · oidc · tag
    needs: [plan]
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture release set
        run: node scripts/tag-released-packages.mjs --dry-run --json --output /tmp/captured.json
      - name: Build
        run: pnpm build
      - name: Publish unpublished versions via OIDC
        run: ./scripts/publish-if-unpublished.sh
      - name: Tag released versions
        run: node scripts/tag-released-packages.mjs --captured /tmp/captured.json
