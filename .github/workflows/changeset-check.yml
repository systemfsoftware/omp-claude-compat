# Thin caller of the shared changeset-check reusable workflow
# (systemfsoftware/pnpm-release-management). It requires a change intent for
# every publishable-package change in a pull request.
#
# tools-ref pins the toolchain revision the check runs from.
name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-check:
    uses: systemfsoftware/pnpm-release-management/.github/workflows/changeset-check.yml@prm/toolchain
    with:
      tools-ref: prm/toolchain
