name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  require-changeset:
    if: github.head_ref != 'changeset-release/main'
    name: a publishable-package change needs a changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changeset gate selftest
        run: node scripts/check-changeset.mjs --selftest
      - name: Require a changeset for publishable-package changes
        run: node scripts/check-changeset.mjs ${{ github.event.pull_request.base.sha }}
